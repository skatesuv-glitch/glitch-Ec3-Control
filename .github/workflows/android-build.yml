name: Android Build

on:
  push:
    branches: [ main, experiment/stellantis-community, experiment/association-diagnostic, experiment/cvs-current-api, experiment/cvs-fresh-apk-cert ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run tests and build debug APK
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/experiment/stellantis-community" ] || [ "${GITHUB_HEAD_REF}" = "experiment/stellantis-community" ] || [ "${GITHUB_REF}" = "refs/heads/experiment/association-diagnostic" ] || [ "${GITHUB_HEAD_REF}" = "experiment/association-diagnostic" ] || [ "${GITHUB_REF}" = "refs/heads/experiment/cvs-current-api" ] || [ "${GITHUB_HEAD_REF}" = "experiment/cvs-current-api" ] || [ "${GITHUB_REF}" = "refs/heads/experiment/cvs-fresh-apk-cert" ] || [ "${GITHUB_HEAD_REF}" = "experiment/cvs-fresh-apk-cert" ]; then
            CONFIG_URL="https://raw.githubusercontent.com/andreadegiovine/homeassistant-stellantis-vehicles/develop/custom_components/stellantis_vehicles/configs.json"
            curl -fsSL "$CONFIG_URL" -o /tmp/stellantis-configs.json
            CLIENT_ID="$(python3 -c 'import json; d=json.load(open("/tmp/stellantis-configs.json")); print(d["MyCitroen"]["configs"]["ES"]["client_id"])')"
            CLIENT_SECRET="$(python3 -c 'import json; d=json.load(open("/tmp/stellantis-configs.json")); print(d["MyCitroen"]["configs"]["ES"]["client_secret"])')"
            test -n "$CLIENT_ID" && test -n "$CLIENT_SECRET"
            if [ "${GITHUB_REF}" = "refs/heads/experiment/cvs-current-api" ] || [ "${GITHUB_HEAD_REF}" = "experiment/cvs-current-api" ] || [ "${GITHUB_REF}" = "refs/heads/experiment/cvs-fresh-apk-cert" ] || [ "${GITHUB_HEAD_REF}" = "experiment/cvs-fresh-apk-cert" ]; then
              mkdir -p app/src/main/res/raw
              curl -fsSL "https://raw.githubusercontent.com/flobz/psa_apk/main/mycitroen.apk.bz2" -o /tmp/mycitroen.apk.bz2
              bunzip2 -f /tmp/mycitroen.apk.bz2
              unzip -p /tmp/mycitroen.apk assets/MWPMYMA1.pfx > app/src/main/res/raw/mwp.dat
              test -s app/src/main/res/raw/mwp.dat
              openssl pkcs12 -in app/src/main/res/raw/mwp.dat -clcerts -nokeys -passin pass:y5Y2my5B -out /tmp/mwp-cert.pem
              echo "Transport certificate from current MyCitroen APK:"
              openssl x509 -in /tmp/mwp-cert.pem -noout -subject -issuer -dates -fingerprint -sha256
              rm -f /tmp/mwp-cert.pem /tmp/mycitroen.apk
            fi
            echo "::add-mask::$CLIENT_ID"
            echo "::add-mask::$CLIENT_SECRET"
            gradle testDebugUnitTest assembleDebug -PCITROEN_CLIENT_ID="$CLIENT_ID" -PCITROEN_CLIENT_SECRET="$CLIENT_SECRET"
            unset CLIENT_ID CLIENT_SECRET
            rm -f /tmp/stellantis-configs.json
          else
            gradle testDebugUnitTest assembleDebug
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EC3-Control-debug
          path: app/build/outputs/apk/debug/app-debug.apk
